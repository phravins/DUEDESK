# Local development services for DueDesk.
# Postgres runs on 5435 to avoid clashing with other local databases.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - duedesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: duedesk
      MINIO_ROOT_PASSWORD: duedesk-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - duedesk_minio:/data

volumes:
  duedesk_pg:
  duedesk_minio:
